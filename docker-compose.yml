# The platform is a single process over a single SQLite file, so the stack is
# one service. The database and the uploaded media live on named volumes and
# survive `docker compose down`.

services:
  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/whatsapp.db
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-8}
      DATABASE_BUSY_TIMEOUT: ${DATABASE_BUSY_TIMEOUT:-10s}

      APP_ENV: ${APP_ENV:-production}
      PORT: 8086
      TIMEZONE: ${TIMEZONE:-Asia/Almaty}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Behind a reverse proxy this must list the proxy's address, otherwise
      # forwarded client ip headers are ignored and rate limiting keys on the
      # proxy itself.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      GREEN_API_INSTANCE_ID: ${GREEN_API_INSTANCE_ID:-}
      GREEN_API_TOKEN: ${GREEN_API_TOKEN:-}
      GREEN_API_URL: ${GREEN_API_URL:-https://api.green-api.com}
      GREEN_API_MEDIA_URL: ${GREEN_API_MEDIA_URL:-https://media.green-api.com}
      GREEN_API_WEBHOOK_TOKEN: ${GREEN_API_WEBHOOK_TOKEN:-}

      MEDIA_STORAGE_PATH: /app/storage/media
      MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB:-64}

      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_WORKERS: ${SCHEDULER_WORKERS:-4}
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/storage/media
    ports:
      - "${APP_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlite_data:
  media_data:
