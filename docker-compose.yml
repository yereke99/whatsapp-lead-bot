services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_automation}
      # C collation keeps index behaviour predictable across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsapp} -d ${POSTGRES_DB:-whatsapp_automation}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not published by default: only the application needs to reach the
    # database. Uncomment for local inspection.
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-whatsapp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-whatsapp_automation}?sslmode=disable
      APP_ENV: ${APP_ENV:-production}
      PORT: 8080
      TIMEZONE: ${TIMEZONE:-Asia/Almaty}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Behind a reverse proxy this must list the proxy's address, otherwise
      # forwarded client ip headers are ignored and rate limiting keys on the
      # proxy itself.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      GREEN_API_INSTANCE_ID: ${GREEN_API_INSTANCE_ID:-}
      GREEN_API_TOKEN: ${GREEN_API_TOKEN:-}
      GREEN_API_URL: ${GREEN_API_URL:-https://api.green-api.com}
      GREEN_API_MEDIA_URL: ${GREEN_API_MEDIA_URL:-https://media.green-api.com}
      GREEN_API_WEBHOOK_TOKEN: ${GREEN_API_WEBHOOK_TOKEN:-}

      MEDIA_STORAGE_PATH: /app/storage/media
      MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB:-64}

      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_WORKERS: ${SCHEDULER_WORKERS:-4}
    volumes:
      - media_data:/app/storage/media
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  media_data:
